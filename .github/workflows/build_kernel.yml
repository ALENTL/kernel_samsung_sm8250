name: Build tl_kernel

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "Changelog"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEVICE: r8q
      KERNEL_NAME: tl_kernel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            jq \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            zip \
            zstd

      - name: Set build information
        run: |
          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"
          echo "BUILD_DATE_HUMAN=$(date +'%d %B %Y')" >> "$GITHUB_ENV"
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Calculate build duration
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          MINUTES=$((DURATION / 60))
          SECONDS_REMAINING=$((DURATION % 60))

          echo "BUILD_DURATION=${MINUTES}m ${SECONDS_REMAINING}s" >> "$GITHUB_ENV"

      - name: Verify AnyKernel3 ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No AnyKernel3 ZIP was generated"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Generate SHA256
        run: |
          sha256sum "$ZIP_FILE" | tee "${ZIP_FILE}.sha256"

      - name: Collect build information
        run: |
          set -e

          KERNEL_VERSION=$(cat out/include/config/kernel.release)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"

          CLANG_VERSION=$(
            "$GITHUB_WORKSPACE/toolchains/neutron-clang/bin/clang" \
              --version |
              head -n1
          )
          echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"

          KSU_VERSION="Unknown"

          if git -C KernelSU rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C KernelSU fetch --tags --force
            KSU_VERSION=$(git -C KernelSU describe --tags --always)
          fi
          
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"

          SUSFS_VERSION="Unknown"

          if [ -f "include/linux/susfs.h" ]; then
            SUSFS_VERSION=$(
              grep -m1 'SUSFS_VERSION' include/linux/susfs.h |
              awk -F'"' '{print $2}' || true
            )
          fi

          echo "SUSFS_VERSION=$SUSFS_VERSION" >> "$GITHUB_ENV"

      - name: Prepare release information
        run: |
          echo "RELEASE_TAG=r8q-${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=tl_kernel ${KERNEL_VERSION} for Galaxy S20 FE" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tl-kernel-r8q
          path: |
            ${{ env.ZIP_FILE }}
            ${{ env.ZIP_FILE }}.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: false
          body: |
            ## tl_kernel

            Kernel build for the Samsung Galaxy S20 FE 5G (r8q).

            | Information | Value |
            |---|---|
            | Kernel | `${{ env.KERNEL_VERSION }}` |
            | Device | Galaxy S20 FE 5G (r8q) |
            | Kernel name | `tl_kernel` |
            | Clang | `${{ env.CLANG_VERSION }}` |
            | KernelSU | `${{ env.KSU_VERSION }}` |
            | SusFS | `${{ env.SUSFS_VERSION }}` |
            | Commit | `${{ env.COMMIT_HASH }}` |
            | Build date | `${{ env.BUILD_DATE_HUMAN }}` |
            | Build duration | `${{ env.BUILD_DURATION }}` |

            ### Changelog

            ${{ inputs.changelog }}

            SHA256 checksum is included with the kernel ZIP.

          files: |
            ${{ env.ZIP_FILE }}
            ${{ env.ZIP_FILE }}.sha256

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
