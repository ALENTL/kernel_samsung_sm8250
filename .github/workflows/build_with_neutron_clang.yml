name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - sixteen

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEVICE: r8q

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            jq \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            zip \
            zstd

      - name: Build kernel
        run: |
          chmod +x build_with_neutron_clang.sh
          ./build_with_neutron_clang.sh

      - name: Verify AnyKernel3 ZIP
        run: |
          echo "Generated files:"
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No AnyKernel3 ZIP was generated"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Generate SHA256
        run: |
          sha256sum "$ZIP_FILE" | tee "${ZIP_FILE}.sha256"

      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-r8q-anykernel3
          path: |
            ${{ env.ZIP_FILE }}
            ${{ env.ZIP_FILE }}.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r8q-${{ github.run_number }}
          name: Kernel r8q - Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            ${{ env.ZIP_FILE }}
            ${{ env.ZIP_FILE }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}